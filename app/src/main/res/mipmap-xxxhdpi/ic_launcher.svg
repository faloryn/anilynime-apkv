<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="50%" stop-color="#181335" />
      <stop offset="100%" stop-color="#090714" />
    </linearGradient>

    <!-- Vibrant Play & Wing Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />

  <!-- Outer Cyber Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ff2a85" stroke-width="2.5" stroke-dasharray="12 18" opacity="0.35" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 14" opacity="0.25" />

  <!-- Dynamic Katana / Anime Spark Accents -->
  <path d="M 120 180 L 175 140 L 155 200 Z" fill="url(#accent-cyan)" opacity="0.8" filter="url(#neon-glow)" />
  <path d="M 390 330 L 335 370 L 355 310 Z" fill="url(#primary-grad)" opacity="0.8" filter="url(#neon-glow)" />

  <!-- Center Stylized 'A' + Streaming Triangle (Play Icon) -->
  <path d="M 256 100 
           L 395 365 
           L 320 365 
           L 290 305 
           L 222 305 
           L 192 365 
           L 117 365 Z 
           M 256 195 
           L 236 245 
           L 276 245 Z" 
        fill="url(#primary-grad)" 
        filter="url(#neon-glow)" />

  <!-- Play Pulse Triangle Inside the A -->
  <polygon points="240,230 285,255 240,280" fill="#ffffff" />

  <!-- Glowing Star / Sparkle in Top Right -->
  <circle cx="360" cy="140" r="10" fill="#00f2fe" filter="url(#neon-glow)" />
  <circle cx="360" cy="140" r="5" fill="#ffffff" />
</svg>
